<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bài tập về nhà 1 · Đọc hiểu N3</title>
  <meta name="description" content="Đọc hiểu N3 – Bài tập về nhà 1: 問題34, 44, 46 (văn giải thích, văn nêu ý kiến) kèm từ vựng, Hán Việt, bản dịch và giải thích đáp án.">
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/auth.js"></script>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="back admin-only" href="index.html">← Mục lục</a>
      <div>
        <h1>Bài tập về nhà 1</h1>
        <div class="sub">問題34 · 44 · 46 — Văn giải thích · Văn nêu ý kiến</div>
      </div>
      <div class="top-actions">
        <button type="button" class="tool" data-action="logout">Đăng xuất</button>
        <button type="button" class="btn finish" data-action="finish">Hoàn thành</button>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div class="toolbar">
        <span class="label">Furigana</span>
        <div class="seg" role="group" aria-label="Furigana">
          <button type="button" data-set-furigana="all">Tất cả</button>
          <button type="button" data-set-furigana="hard">Kanji khó</button>
          <button type="button" data-set-furigana="off">Tắt</button>
        </div>
        <button type="button" class="tool" data-action="toggle-vi" aria-pressed="false">Dịch tất cả</button>
        <span class="spacer"></span>
        <button type="button" class="tool" data-action="font-down" aria-label="Giảm cỡ chữ">A−</button>
        <button type="button" class="tool" data-action="font-up" aria-label="Tăng cỡ chữ">A+</button>
        <button type="button" class="tool" data-action="theme" aria-label="Đổi giao diện sáng/tối">◐</button>
    </div>
  </div>
  <div class="sticky">
    <div class="wrap">
      <nav class="tabs" id="tabs" aria-label="Các bài trong Bài tập về nhà 1"></nav>
    </div>
  </div>

  <main class="wrap" id="app" lang="vi"></main>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true">
      <button type="button" class="sheet-close" data-action="close-sheet" aria-label="Đóng">×</button>
      <div class="sheet-body"></div>
    </div>
  </div>

  <script src="data/btvn-1.js"></script>
  <script src="assets/app.js"></script>
